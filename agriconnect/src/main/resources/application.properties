# ===============================
# DATABASE POSTGRESQL (DOCKER / RENDER)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/agriconnectdata}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin_agri}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:botis}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# CONFIGURATION FICHIERS
# ===============================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# LOGGING (OPTIONNEL)
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE